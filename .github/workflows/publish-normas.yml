name: Publicar normas.json

# Monta normas.json (Diarios Oficiais de MG + DOU via ACAM) e commita neste repo
# publico, para o briefing diario ler via raw.githubusercontent.
# O Diario do Executivo sai de terca a sabado, disponivel na API ainda na madrugada.
# O briefing (routine claude.ai) le o normas.json as 07:15 BRT (10:15 UTC), entao o
# radar precisa estar publicado ANTES disso. O cron do GitHub atrasa horas em dias
# ruins (em 22/09/2026 as passadas de 10:30 e 12:30 UTC rodaram 15:06 e 17:09 UTC),
# por isso tres passadas a partir das 03:00 BRT, em minutos fora da hora cheia.
# Coleta os ultimos 10 dias pela data de PUBLICACAO e o build so reporta o que
# apareceu pela primeira vez nos ultimos 3 dias (state.json).
#
# Pre-requisito: secret RADAR_READ_KEY (mesmo valor da variavel no Railway do ACAM),
# usado so para o DOU. Sem ele, MG continua saindo normalmente.

on:
  schedule:
    - cron: '7 6 * * *'     # 03:07 BRT
    - cron: '23 8 * * *'    # 05:23 BRT (segunda passada)
    - cron: '41 9 * * *'    # 06:41 BRT (ultima antes do briefing das 07:15)
  workflow_dispatch:
    inputs:
      dias:
        description: 'Janela de coleta no Diario, em dias (padrao 10)'
        required: false
        default: '10'

concurrency:
  group: publicar-normas
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar PyMuPDF
        run: pip install --quiet pymupdf
      - name: Coletar Diarios Oficiais de MG
        run: |
          DIAS="${{ github.event.inputs.dias }}"
          python scripts/doe_mg_coleta.py --dias "${DIAS:-10}" --saida normas-doe.json --cache "$RUNNER_TEMP/cache_doe"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Montar normas.json
        env:
          RADAR_READ_KEY: ${{ secrets.RADAR_READ_KEY }}
        run: node scripts/build-normas.mjs
      - name: Commitar se houve mudanca
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add normas.json state.json
          if git diff --cached --quiet; then
            echo "Sem mudancas."
          else
            git commit -m "chore: atualiza normas.json ($(date -u +%FT%TZ))"
            git push
          fi
